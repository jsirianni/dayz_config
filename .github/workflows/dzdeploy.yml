name: dzdeploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s scripts -p 'test_install_dzdeploy.py'
      - name: Install pinned dzdeploy release
        run: python scripts/install-dzdeploy.py
      - name: Smoke-test and validate configuration
        shell: bash
        run: |
          set -euo pipefail
          .tools/bin/dzdeploy --help
          .tools/bin/dzdeploy version
          .tools/bin/dzdeploy tools install
          .tools/bin/dzdeploy validate all --json > .tools/config-validation.json
      - name: Verify packaging from a Go-free configuration checkout
        run: python scripts/verify-dzdeploy-checkout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-validation-${{ runner.os }}
          path: .tools/config-validation.json
          if-no-files-found: warn
