name: dzdeploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o .tools/bin/ ./cmd/dzdeploy
      - name: Test SSH bootstrap with mocked Windows facilities
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-bootstrap-windows.ps1
      - run: go run ./cmd/dzdeploy-package
      - uses: actions/upload-artifact@v4
        with:
          name: dzdeploy-${{ runner.os }}
          path: .tools/packages/*.zip
  bootstrap-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test real SSH bootstrap with unavailable Windows capabilities
        shell: powershell
        run: .\scripts\test-bootstrap-windows-integration.ps1 -DisposableRunner
      - name: Upload SSH integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-bootstrap-${{ matrix.os }}
          path: .tools/bootstrap-integration/
          if-no-files-found: warn
  race-and-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  operator-integration:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test isolated service, hard restart, backup, and restore
        run: go test ./internal/deploy -run '^TestOperatorServiceIntegration$' -count=1 -v -timeout 10m
        env:
          DZDEPLOY_OPERATOR_INTEGRATION: '1'
  agent-upgrade-integration:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Test durable agent upgrades, rollback, and debugger crash isolation
        run: go test ./internal/deploy -run '^(TestAgentUpgradeServiceIntegration|TestUpgradeLegacyDebuggerPreservesChild)$' -count=1 -v -timeout 15m
        env:
          DZDEPLOY_UPGRADE_INTEGRATION: '1'
          DZDEPLOY_UPGRADE_DEBUG_INTEGRATION: '1'
