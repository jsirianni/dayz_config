name: dzdeploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-dzdeploy.sh scripts/verify-dzdeploy-checkout.sh
          bash scripts/install-dzdeploy.sh
          .tools/bin/dzdeploy --help
          .tools/bin/dzdeploy version
          .tools/bin/dzdeploy tools install
          .tools/bin/dzdeploy validate all --json > .tools/config-validation.json
          bash scripts/verify-dzdeploy-checkout.sh
      - name: Install and validate on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\install-dzdeploy.ps1
          & .tools/bin/dzdeploy.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke check failed.' }
          & .tools/bin/dzdeploy.exe version
          if ($LASTEXITCODE -ne 0) { throw 'Version smoke check failed.' }
          & .tools/bin/dzdeploy.exe tools install
          if ($LASTEXITCODE -ne 0) { throw 'dzcli installation failed.' }
          & .tools/bin/dzdeploy.exe validate all --json > .tools/config-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Configuration validation failed.' }
          .\scripts\verify-dzdeploy-checkout.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-validation-${{ runner.os }}
          path: .tools/config-validation.json
          if-no-files-found: warn
